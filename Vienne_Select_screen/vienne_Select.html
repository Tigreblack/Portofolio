            <!-- Loading overlay -->
            <div id="loading-overlay">
                <div class="lo-header" id="lo-header"><div class="lo-dots"></div></div>
                <img class="lo-vehicle" id="lo-vehicle" src="" alt="">
                <h1 class="lo-title" id="lo-title">DODE.html</h1>
                <div class="lo-bar-area">
                    <div class="lo-bar-track" id="lo-bar-track"><div class="lo-bar-fill" id="lo-bar-fill"></div></div>
                    <div class="lo-pins" id="lo-pins">
                        <p class="lo-pin-txt" id="lo-pin-from"></p>
                        <p class="lo-pin-txt" id="lo-pin-to"></p>
                    </div>
                    <p class="lo-loading-txt" id="lo-loading-txt">Loading...</p>
                </div>
            </div>

            <script>
                function triggerLoading(destination, el) {
                    var d = (el && el.dataset) ? el.dataset : (el || {});
                    var overlay    = document.getElementById('loading-overlay');
                    var fill       = document.getElementById('lo-bar-fill');
                    var barTrack   = document.getElementById('lo-bar-track');
                    var titleEl    = document.getElementById('lo-title');
                    var vehicle    = document.getElementById('lo-vehicle');
                    var header     = document.getElementById('lo-header');
                    var pins       = document.getElementById('lo-pins');
                    var pinFrom    = document.getElementById('lo-pin-from');
                    var pinTo      = document.getElementById('lo-pin-to');
                    var loadingTxt = document.getElementById('lo-loading-txt');
                    if (d.loadingBg) {
                        overlay.style.backgroundImage    = "url('" + d.loadingBg + "')";
                        overlay.style.backgroundSize     = 'cover';
                        overlay.style.backgroundPosition = 'center';
                    } else { overlay.style.backgroundImage = ''; }
                    titleEl.textContent = d.loadingTitle || 'DODE.html';
                    var hasVehicle = !!d.loadingVehicle;
                    header.style.display  = hasVehicle ? 'flex' : 'none';
                    vehicle.style.display = hasVehicle ? 'block' : 'none';
                    if (hasVehicle) { vehicle.src = d.loadingVehicle; titleEl.classList.add('lo-title--small'); }
                    else { titleEl.classList.remove('lo-title--small'); }
                    var hasPins = !!(d.loadingFrom && d.loadingTo);
                    pins.style.display       = hasPins ? 'flex' : 'none';
                    loadingTxt.style.display = hasPins ? 'none' : 'block';
                    if (hasPins) { pinFrom.textContent = d.loadingFrom; pinTo.textContent = d.loadingTo; }
                    barTrack.style.backgroundColor = d.loadingBarBg || '#2d0c28';
                    fill.style.backgroundColor     = d.loadingBar   || '#d51cbf';
                    fill.style.width = '0%';
                    overlay.style.display = 'flex';
                    var width = 0;
                    var speed = parseInt(d.loadingSpeed || '30');
                    var interval = setInterval(function() {
                        width++;
                        fill.style.width = width + '%';
                        if (width >= 100) { clearInterval(interval); window.location.href = destination; }
                    }, speed);
                }

                document.addEventListener('DOMContentLoaded', function() {
                    document.querySelectorAll('.tile').forEach(function(tile) {
                        tile.addEventListener('click', function(e) {
                            var dest = tile.getAttribute('href');
                            if (!dest || dest === '#') return;
                            e.preventDefault();
                            triggerLoading(dest, tile);
                        });
                    });
                });
            </script>
        </body>
