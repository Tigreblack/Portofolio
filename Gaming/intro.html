<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            cursor: default;
            user-select: none;
        }

        /* ── SCANLINES GLOBALES ── */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* ── SYSTEME DE PHASES ── */
        .phase {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.55s ease;
        }
        .phase.active { opacity: 1; }

        /* ════════════════════════════════════════
           PHASE 1 — TIGRE STUDIO  (cameo EA Games)
           ════════════════════════════════════════ */
        #phase-tigre { background: #000; gap: 18px; }

        .tigre-oval {
            width: clamp(160px, 36vw, 260px);
            height: clamp(160px, 36vw, 260px);
            border: 4px solid #fff;
            border-radius: 50%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 4px;
            box-shadow: 0 0 60px rgba(255,255,255,0.15),
                        inset 0 0 60px rgba(0,0,0,0.6);
            opacity: 0; transform: scale(0.7);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2,0,0.1,1);
        }
        #phase-tigre.active .tigre-oval { opacity: 1; transform: scale(1); }

        .tigre-emoji {
            font-size: clamp(52px, 13vw, 96px);
            line-height: 1;
        }
        .tigre-sep  { width: 60%; height: 3px; background: #fff; margin: 4px 0; }
        .tigre-name {
            font-family: 'Arial Black', Arial, sans-serif;
            font-size: clamp(10px, 2.2vw, 17px);
            font-weight: 700;
            color: rgba(255,255,255,0.9);
            letter-spacing: 10px;
            text-transform: uppercase;
        }
        .tigre-tagline {
            font-family: Arial, sans-serif;
            font-size: clamp(8px, 1.5vw, 11px);
            color: rgba(255,255,255,0.38);
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.6s ease 0.65s;
        }
        #phase-tigre.active .tigre-tagline { opacity: 1; }

        /* ════════════════════════════════════════
           PHASE 2 — VIDEO + WRONG PROJECT
           ════════════════════════════════════════ */

        /* Vidéo plein écran seamless */
        #intro-video {
            position: fixed;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            background: #000;
            z-index: 50;
            display: none;
        }

        /* Wrong project — overlay post-vidéo */
        #phase-dice {
            background: #000;
            z-index: 60;
        }

        .dice-error {
            font-family: 'Courier New', monospace;
            font-size: clamp(13px, 3vw, 22px);
            color: #ff3333;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,50,50,1), 0 0 60px rgba(255,0,0,0.4);
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        #phase-dice.active .dice-error { opacity: 1; }

        #phase-dice.active {
            animation: wrong-glitch 0.22s step-end infinite;
        }
        @keyframes wrong-glitch {
            0%   { filter: none; transform: translate(0,0); }
            20%  { filter: hue-rotate(90deg) brightness(1.8) saturate(2); transform: translate(-4px, 2px); }
            40%  { filter: none; transform: translate(0,0); }
            60%  { filter: hue-rotate(-90deg) brightness(0.6); transform: translate(3px,-2px); }
            80%  { filter: none; transform: translate(0,0); }
            100% { filter: none; transform: translate(0,0); }
        }

        /* ════════════════════════════════════════
           PHASE 3 — DODE LUCAS  (pixel art / Shibuya)
           ════════════════════════════════════════ */
        #phase-dode {
            background: #000; gap: 0;
            text-align: center;
            padding: clamp(32px, 6vh, 80px) clamp(16px, 4vw, 80px);
        }

        .dode-pre {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(8px, 1.4vw, 13px);
            color: rgba(255, 80, 160, 0.45);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 0.4s ease 0.2s;
        }
        #phase-dode.active .dode-pre { opacity: 1; }

        .dode-title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(42px, 10vw, 100px);
            color: #ff2d78;
            text-shadow:
                0 0 12px rgba(255, 45, 120, 1),
                0 0 30px rgba(255, 45, 120, 0.7),
                0 0 70px rgba(255, 45, 120, 0.35),
                4px 4px 0 rgba(120, 0, 50, 0.9);
            letter-spacing: clamp(2px, 1vw, 10px);
            line-height: 1;
            opacity: 0; transform: translateY(-36px);
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2,0,0.1,1);
        }
        #phase-dode.active .dode-title { opacity: 1; transform: translateY(0); }

        .dode-sep {
            width: clamp(60px, 20vw, 180px);
            height: 3px;
            background: linear-gradient(90deg, transparent, #00f5ff, #ff2d78, transparent);
            margin: clamp(10px, 2vh, 18px) auto;
            opacity: 0;
            transition: opacity 0.4s ease 0.08s;
        }
        #phase-dode.active .dode-sep { opacity: 1; }

        .dode-sub {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(26px, 6vw, 62px);
            color: #00f5ff;
            text-shadow:
                0 0 10px rgba(0, 245, 255, 1),
                0 0 28px rgba(0, 245, 255, 0.6),
                0 0 60px rgba(0, 245, 255, 0.25),
                3px 3px 0 rgba(0, 60, 80, 0.9);
            letter-spacing: clamp(2px, 0.8vw, 8px);
            line-height: 1;
            opacity: 0; transform: translateY(36px);
            transition: opacity 0.3s ease 0.1s, transform 0.3s cubic-bezier(0.2,0,0.1,1) 0.1s;
        }
        #phase-dode.active .dode-sub { opacity: 1; transform: translateY(0); }


        /* Impact pixel — flash rose au chargement */
        #phase-dode.active { animation: dode-impact 0.45s ease-out 0.06s both; }
        @keyframes dode-impact {
            0%  { transform: translate(0,0) scale(1.04); filter: brightness(2) saturate(0); }
            20% { transform: translate(-4px, 3px) scale(1); filter: brightness(1.3); }
            40% { transform: translate(4px,-3px) scale(1); filter: none; }
            65% { transform: translate(-2px, 2px) scale(1); filter: none; }
            100%{ transform: translate(0,0) scale(1); filter: none; }
        }

        /* ════════════════════════════════════════
           PHASE 4 — TERMINAL
           ════════════════════════════════════════ */
        #phase-terminal {
            background: #000;
            align-items: flex-start;
            justify-content: flex-start;
            padding: clamp(24px, 5vw, 60px) clamp(20px, 5vw, 80px);
            font-family: 'Courier New', 'Lucida Console', monospace;
            overflow-y: auto;
        }

        .term-inner {
            width: 100%; max-width: 860px;
            margin: 0 auto;
        }

        .term-line {
            font-size: clamp(10px, 1.8vw, 14px);
            color: #00ff41;
            line-height: 1.85;
            white-space: pre-wrap;
            text-shadow: 0 0 8px rgba(0,255,65,0.55);
        }
        .term-line.dim        { color: rgba(0,255,65,0.42); text-shadow: none; }
        .term-line.amber      { color: #ffb700; text-shadow: 0 0 10px rgba(255,183,0,0.65); }
        .term-line.white      { color: #eee;    text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .term-line.error-line { color: #ff4444; text-shadow: 0 0 12px rgba(255,68,68,0.8); }
        .term-line.star       { color: #ffb700; text-shadow: 0 0 10px rgba(255,183,0,0.65); }
        .term-line.granted {
            color: #00ff41;
            font-size: clamp(13px, 2.8vw, 20px);
            font-weight: bold;
            text-shadow: 0 0 24px rgba(0,255,65,1);
            letter-spacing: 2px;
        }

        .term-cursor {
            display: inline-block;
            width: 9px; height: 1em;
            background: #00ff41;
            vertical-align: text-bottom;
            animation: blink-c 0.65s step-end infinite;
        }
        @keyframes blink-c { 0%,100%{opacity:1} 50%{opacity:0} }

        .skip-hint {
            position: fixed;
            bottom: clamp(18px, 3vh, 32px);
            right: clamp(18px, 3vw, 36px);
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(9px, 1.4vw, 13px);
            color: rgba(0,255,65,0.55);
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 9998;
            animation: skip-blink 1.4s step-end infinite;
        }
        @keyframes skip-blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.2; }
        }
    </style>
</head>
<body>

    <!-- ── PHASE 1 : TIGRE STUDIO ── -->
    <div id="phase-tigre" class="phase">
        <div class="tigre-oval">
            <div class="tigre-emoji">🕹️</div>
            <div class="tigre-sep"></div>
            <div class="tigre-name">STUDIO</div>
        </div>
        <div class="tigre-tagline">A TIGREBLACK PRODUCTION</div>
    </div>

    <!-- ── VIDÉO PLEIN ÉCRAN ── -->
    <video id="intro-video" playsinline preload="auto">
        <source src="Old Dice Logo  Intro.mp4" type="video/mp4">
    </video>

    <!-- ── PHASE 2 : WRONG PROJECT (post-vidéo) ── -->
    <div id="phase-dice" class="phase">
        <div class="dice-error">// &nbsp; ERROR &mdash; WRONG FILES &nbsp; //</div>
    </div>

    <!-- ── PHASE 3 : DODE LUCAS (style BF2 title splash) ── -->
    <div id="phase-dode" class="phase">
        <div class="dode-pre">ALL RIGHT DESERVED INC</div>
        <div class="dode-title">DODE</div>
        <div class="dode-sep"></div>
        <div class="dode-sub">LUCAS</div>
    </div>

    <!-- ── PHASE 4 : TERMINAL ── -->
    <div id="phase-terminal" class="phase">
        <div class="term-inner" id="term-inner"></div>
    </div>

    <div class="skip-hint" id="skip-hint">[ CLIQUER POUR PASSER ]</div>

    <script>
    (function () {
        'use strict';

        const phases = {
            tigre:    document.getElementById('phase-tigre'),
            dice:     document.getElementById('phase-dice'),
            dode:     document.getElementById('phase-dode'),
            terminal: document.getElementById('phase-terminal')
        };
        const video     = document.getElementById('intro-video');
        const termInner = document.getElementById('term-inner');
        const skipHint  = document.getElementById('skip-hint');

        let currentPhase = 'tigre';
        let introAborted = false;

        /* ── HELPERS ── */
        function hideAll() {
            Object.values(phases).forEach(p => {
                p.classList.remove('active');
                p.classList.remove('error');
            });
        }
        function show(name) { hideAll(); phases[name].classList.add('active'); currentPhase = name; }
        function sleep(ms)  { return new Promise(r => setTimeout(r, ms)); }

        /* ── TYPEWRITER ── */
        async function typeLine(text, cls = '', charDelay = 14) {
            const line = document.createElement('div');
            line.className = 'term-line' + (cls ? ' ' + cls : '');
            termInner.appendChild(line);

            if (!text) { line.innerHTML = '&nbsp;'; termInner.parentElement.scrollTop = 999999; return; }

            return new Promise(resolve => {
                const cur = document.createElement('span');
                cur.className = 'term-cursor';
                line.appendChild(cur);
                let i = 0;
                function tick() {
                    if (i < text.length) {
                        cur.insertAdjacentText('beforebegin', text[i++]);
                        termInner.parentElement.scrollTop = 999999;
                        setTimeout(tick, Math.max(4, charDelay + (Math.random() * 6 - 3)));
                    } else { cur.remove(); resolve(); }
                }
                tick();
            });
        }
        const blankLine = () => typeLine('', '', 0);

        /* ── SEQUENCE TERMINAL ── */
        async function runTerminal() {
            currentPhase = 'terminal';
            termInner.innerHTML = '';
            const G = (t, c, d) => typeLine(t, c, d);
            const S = sleep;

            /* Boot */
            await G('> SYSTEM BOOT....................  OK', 'dim', 12);
            await S(80);
            await G('> INTERFACE TERMINAL v2.5........  OK', 'dim', 12);
            await S(60);
            await G('> SONIC_SPEED_MODE ...............  ACTIVE', 'dim', 12);
            await S(140);
            await blankLine();

            /* Identification */
            await G('> IDENTIFICATION REQUISE', 'white', 16);
            await G('  ────────────────────────────────────────', 'dim', 5);
            await blankLine();

            /* Tentative 1 — echec */
            await G('  LOGIN    : defaultplayer', '', 18);
            await S(220);
            await G('  PASSWORD : ████████', 'dim', 22);
            await S(400);
            await blankLine();
            await G('> ERREUR : MAUVAIS JOUEUR // ACCES REFUSE', 'error-line', 13);
            await S(100);
            await G('> REINITIALISATION EN COURS...', 'dim', 12);
            await S(520);
            await blankLine();

            /* Tentative 2 — succes */
            await G('  LOGIN    : tigreblack', '', 18);
            await S(220);
            await G('  PASSWORD : ████████████', 'dim', 22);
            await S(400);
            await blankLine();
            await G('> VERIFICATION EN COURS.........', 'dim', 13);
            await S(320);
            await G('> JOUEUR IDENTIFIE   :  TIGREBLACK', '', 14);
            await S(60);
            await G("  NIVEAU D'ACCES     :  HEDGEHOG_PASS", 'dim', 10);
            await S(60);
            await G('  STATUT             :  AUTORISE', 'dim', 10);
            await S(220);
            await blankLine();

            /* Profil operateurs */
            await G('> CHARGEMENT PROFIL OPERATEUR...', '', 14);
            await S(160);
            await blankLine();
            await G('  ┌─────────────────────────────────────────────┐', 'dim', 5);
            await G('  │  OPERATEURS FAVORIS // TIGREBLACK            │', 'dim', 5);
            await G('  ├─────────────────────────────────────────────┤', 'dim', 5);
            await G('  │  [CHN-LI]  CHUN-LI ........... STREET FIGHTER  │', 'star', 6);
            await G('  │             >> SPINNING BIRD KICK: UNLOCKED  │', 'dim', 6);
            await G('  ├─────────────────────────────────────────────┤', 'dim', 5);
            await G('  │  [SONIC ]  SONIC THE HEDGEHOG  SONIC SERIES  │', 'dim', 6);
            await G('  │             >> GOTTA GO FAST: TRUE            │', 'dim', 6);
            await G('  ├─────────────────────────────────────────────┤', 'dim', 5);
            await G('  │  [D.VA  ]  D.VA ............... OVERWATCH 2  │', 'dim', 6);
            await G('  │             >> MEKA_STATUS: ONLINE            │', 'dim', 6);
            await G('  └─────────────────────────────────────────────┘', 'dim', 5);
            await S(180);
            await blankLine();
            await G('> 3 OPERATEURS IDENTIFIES // MAINS CHARGES', '', 13);
            await S(200);
            await blankLine();

            /* Catalogue */
            await G('> CHARGEMENT CATALOGUE JEUX FAVORIS...', '', 14);
            await S(200);
            await G('> SCANNING ENTRIES.......', 'dim', 11);
            await S(280);
            await blankLine();

            const entries = [
                ['BGE   ', 'BEYOND GOOD AND EVIL (2003)',    '★ JEU FAVORI #1'],
                ['MC    ', 'MINECRAFT (2011)',                'INDEXE          '],
                ['ANNO  ', 'ANNO 2070 (2012)',                'INDEXE          '],
                ['FSTW  ', 'FORTNITE: SAVE THE WORLD',       'INDEXE          '],
                ['FBR   ', 'FORTNITE: BATTLE ROYALE (2017)', 'INDEXE          '],
                ['OW2   ', 'OVERWATCH 2 (2022)',              'INDEXE          '],
                ['SF    ', 'STREET FIGHTER (SERIE)',          'INDEXE          '],
                ['SONIC ', 'SONIC UNLEASHED (2008)',          'INDEXE          '],
                ['MXATV ', 'MX VS ATV UNLEASHED (2005)',      'INDEXE          '],
                ['RAYMAN', 'RAYMAN LEGENDS (2013)',           'INDEXE          '],
                ['FH6   ', 'FORZA HORIZON 6 (?????)',         'CLASSIFIE       '],
            ];

            for (const [code, name, status] of entries) {
                const isFav  = status.startsWith('★');
                const isClas = status.startsWith('CLAS');
                const cls    = isFav ? 'star' : isClas ? 'amber' : 'dim';
                const dots   = '.'.repeat(Math.max(2, 36 - name.length));
                await G(`  [${code}] ${name} ${dots} ${status.trim()}`, cls, 7);
                await S(32);
            }

            await S(220);
            await blankLine();
            await G(`> ${entries.length} ENTREES // CATALOGUE CHARGE`, '', 14);
            await S(110);
            await G('> VERIFICATION INTEGRITE.........  OK', '', 13);
            await S(150);
            await blankLine();

            /* Access granted */
            await G('  ████████████████████████████████████████', 'amber', 5);
            await G('  ████  ACCES AUTORISE // TIGREBLACK  ████', 'granted', 8);
            await G('  ████████████████████████████████████████', 'amber', 5);
            await S(420);
            await G('  // "NERF THIS." — D.VA //', 'amber', 9);
            await S(320);
            await blankLine();
            await G('> CHARGEMENT GAMING HUB...', 'dim', 14);
            await S(980);

            window.location.replace('./gaming.html');
        }

        /* ── HELPERS VIDEO ── */
        function showVideo() {
            hideAll();
            video.style.display = 'block';
            currentPhase = 'video';
        }
        function hideVideo() {
            video.pause();
            video.style.display = 'none';
        }

        /* ── SEQUENCE PRINCIPALE ── */
        async function runIntro() {

            /* PHASE 1 — TIGRE STUDIO */
            show('tigre');
            await sleep(2300);
            if (introAborted) return;

            /* PHASE 2 — VIDÉO DICE INTRO (plein écran, seamless) */
            showVideo();
            try {
                await video.play();
            } catch(e) {
                /* Autoplay bloqué → fallback muet */
                video.muted = true;
                try { await video.play(); } catch(e2) { hideVideo(); }
            }

            /* Attendre la fin de la vidéo */
            await new Promise(resolve => {
                video.addEventListener('ended', resolve, { once: true });
            });
            if (introAborted) return;

            /* WRONG PROJECT — overlay post-vidéo */
            hideVideo();
            show('dice');
            await sleep(1600);
            if (introAborted) return;

            /* PHASE 3 — DODE LUCAS */
            show('dode');
            await sleep(3500);
            if (introAborted) return;

            /* PHASE 4 — TERMINAL */
            show('terminal');
            phases.terminal.style.opacity = '0';
            phases.terminal.style.transition = 'opacity 0.6s ease';
            await sleep(50);
            phases.terminal.style.opacity = '1';
            skipHint.style.display = 'none';
            await sleep(620);
            await runTerminal();
        }

        /* ── SKIP ── */
        document.addEventListener('click', function () {
            if (currentPhase === 'terminal') {
                window.location.replace('./gaming.html');
            } else {
                introAborted = true;
                hideVideo();
                show('terminal');
                phases.terminal.style.opacity = '1';
                skipHint.style.display = 'none';
                runTerminal();
            }
        });

        /* ── GO ── */
        runIntro();

    })();
    </script>
</body>
</html>
